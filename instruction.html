<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Royale: Drop Zone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10; pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #fff;
            font-size: 4rem; text-transform: uppercase;
            letter-spacing: 5px; margin-bottom: 10px;
            text-shadow: 0 0 20px #3498db; font-style: italic;
        }

        .btn {
            background: #f1c40f;
            color: #000; border: none;
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; transform: skew(-10deg); transition: all 0.2s;
            box-shadow: 5px 5px 0px #e67e22; margin-top: 20px;
        }
        .btn:hover { transform: skew(-10deg) scale(1.05);
            background: #f39c12; }

        /* HUD */
        #hud-top {
            padding: 20px;
            width: 100%; display: flex;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-left: 4px solid #3498db; margin-right: 15px;
            transform: skew(-10deg); color: white;
        }
        .stat-value { font-size: 1.4rem; font-weight: bold;
        }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #aaa;
        }

        #inventory-bar {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .slot {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #555;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            position: relative;
        }

        .slot.active {
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            transform: scale(1.1);
            background: rgba(255,255,255,0.1);
        }

        .slot-num {
            position: absolute;
            top: 2px; left: 5px;
            font-size: 0.7rem; color: #aaa;
        }
        
        .rarity-text {
            font-size: 0.6rem;
            margin-top: 2px;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px; background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 4px black;
            transition: width 0.2s, height 0.2s, opacity 0.2s;
        }
        #crosshair.ads { opacity: 0.8;
            width: 2px; height: 2px; background: red; }
        #crosshair.spread { width: 20px; height: 20px;
            opacity: 0.3; border: 2px solid white; background: transparent; }

        #interaction-msg, #reload-msg, #weapon-msg {
            position: absolute;
            left: 50%; transform: translateX(-50%);
            text-shadow: 1px 1px 0 #000; font-weight: bold; display: none;
        }
        #interaction-msg { top: 60%; color: #f1c40f; font-size: 1.2rem;
        }
        #reload-msg { top: 65%; color: #e74c3c; font-size: 1.2rem; text-transform: uppercase;
        }
        #weapon-msg { top: 55%; color: #3498db; font-size: 1.5rem; font-style: italic;
            text-shadow: 0 0 10px rgba(52, 152, 219, 0.5); }

        .damage-popup {
            position: absolute;
            color: #fff; font-size: 1.5rem;
            font-weight: 900; text-shadow: 2px 2px 0 #000;
            pointer-events: none; transform: translate(-50%, -50%);
        }

        /* Kill Feed */
        #kill-feed {
            position: absolute;
            bottom: 30px;
            left: 20px;
            display: flex;
            flex-direction: column;
            width: 300px;
            pointer-events: none;
        }
        .kill-msg {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            margin-top: 5px;
            border-radius: 4px;
            font-size: 0.9rem;
            border-left: 3px solid #e74c3c;
            animation: fadeOut 4s forwards;
            width: fit-content;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-10px); }
            10% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Damage Direction Indicator */
        #damage-indicator {
            position: absolute;
            top: 50%; left: 50%;
            width: 200px; height: 200px;
            margin-top: -100px; margin-left: -100px;
            border-radius: 50%;
            border: none; 
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        .damage-arrow {
            position: absolute;
            width: 20px; height: 80px;
            background: transparent;
            border-right: 6px solid rgba(231, 76, 60, 0.9); 
            border-radius: 50%; 
            top: 50%; left: 50%;
            margin-top: -40px; 
            margin-left: -10px; 
            transform-origin: 0% 0%; 
            opacity: 0;
            box-shadow: 4px 0 10px rgba(231, 76, 60, 0.5);
            transition: opacity 0.1s;
        }

        #win-screen, #death-screen {
            display: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: auto;
        }
        #win-screen { background: rgba(46, 204, 113, 0.9);
        }
        #death-screen { background: rgba(192, 57, 43, 0.9);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="hud-top" style="display: none;">
            <div class="stat-box" style="border-color: #2ecc71;">
                <div class="stat-label">Health</div>
                <div class="stat-value" id="health-display">100</div>
            </div>
    
            <div class="stat-box" style="border-color: #e67e22;">
                <div class="stat-label">Ammo</div>
                <div class="stat-value" id="ammo-display">--</div>
            </div>
            <div class="stat-box" style="border-color: #e74c3c;">
                <div class="stat-label">Enemies</div>
                <div class="stat-value" id="enemies-display">0</div>
            </div>
        </div>
        
        <div id="damage-indicator" style="display: none;">
            <!-- Arrow dynamically updated/rotated by JS -->
        </div>

        <!-- Kill Feed Container -->
        <div id="kill-feed"></div>

        <div id="interaction-msg">Press E to Search Chest</div>
        <div id="weapon-msg">Picked up Rifle!</div>
   
        <div id="reload-msg">Reloading...</div>
        <div id="crosshair"></div>

        <div id="inventory-bar" style="display: none;">
            <div class="slot active" id="slot-0"><span class="slot-num">1</span><span id="item-0">Pickaxe</span></div>
            <div class="slot" id="slot-1"><span class="slot-num">2</span><span id="item-1">Empty</span></div>
            <div class="slot" id="slot-2"><span class="slot-num">3</span><span id="item-2">Empty</span></div>
            <div class="slot" id="slot-3"><span class="slot-num">4</span><span id="item-3">Empty</span></div>
            <div class="slot" id="slot-4"><span class="slot-num">5</span><span id="item-4">Empty</span></div>
        </div>
    </div>

    <div id="main-menu">
        <h1>Battle Royale<br><span style="font-size: 2rem; color: #f1c40f;">Drop Zone</span></h1>
        <button class="btn" id="play-btn">DROP IN</button>
        <p style="color: #aaa; margin-top: 20px; text-align: center;">
            WASD: Move | SPACE: Jump | 1-5: Inventory<br>
            LMB: Action | RMB: Aim | R: Reload | E: Chests
        </p>
    </div>

    <div id="win-screen">
        <h1 style="font-size: 5rem; font-style: italic;">VICTORY ROYALE!</h1>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <div id="death-screen">
        <h1 style="font-size: 5rem; font-style: italic;">ELIMINATED</h1>
        <button class="btn" onclick="location.reload()">RETURN TO LOBBY</button>
    </div>

    <script>
        // --- Configuration ---
        const WORLD_SIZE = 400;
        const BOT_SPAWN_RADIUS = 100; 
        const PROJECTILE_SPEED = 300; 
        const BOT_MISS_CHANCE = 0.15; 
     
        const GRAVITY = 25;
        const PLAYER_SPEED = 12;
        const JUMP_FORCE = 12;
        const BOT_COUNT = 8;
        const CHEST_COUNT = 16; // Increased chests since bots need them now
        const HITBOX_PADDING = 1.5; 
        
        // NEW: Arm Rotation Variables
        // User requested Math.PI/2. Since standard Forward is -PI/2, we will apply this variable negatively to achieve forward.
        const ARM_ROT_HOLDING = Math.PI / 2; 
        const ARM_ROT_IDLE = 0; 

        // RARITY SYSTEM
        const RARITIES = {
            "Common":    { color: 0x95a5a6, damageMult: 1.0, name: "Common" },
            "Rare":      { color: 0x3498db, damageMult: 1.5, name: "Rare" },
            "Epic":      { color: 0x9b59b6, damageMult: 2.0, name: "Epic" },
            "Legendary": { color: 0xf1c40f, damageMult: 2.5, name: "Legendary" }
        };

        // Weapons Data
        const WEAPONS = {
            "Rifle":   { damage: 20, fireRate: 400, spread: 0.03, range: 200, clip: 30, adsZoom: 1.0, burst: 3 },
            "Shotgun": { damage: 10, fireRate: 800, spread: 0.15, range: 40,  clip: 5,  pellets: 6, adsZoom: 1.5 },
            "SMG":     { damage: 10, fireRate: 100, spread: 0.08, range: 80,  clip: 40, adsZoom: 1.2, auto: true },
            "Sniper":  { damage: 85, fireRate: 1500, spread: 0.001, range: 400, clip: 1, adsZoom: 0.3 }
        };
        // Camera
        const CAM_OFFSET_NORMAL = new THREE.Vector3(0.8, 0.0, 3.0);
        let camOffsetAds = new THREE.Vector3(0.5, 0.0, 1.0); 

        // Game State
        let scene, camera, renderer;
        let player, bots = [], chests = [], projectiles = [];
        let damagePopups = [];
        let terrainMesh;
        let lastTime = performance.now();
        let isGameActive = false;
        
        const keys = { w: false, a: false, s: false, d: false, space: false, r: false };
        let isADS = false;
        let cameraRotation = { x: 0, y: 0 };
        
        // Inventory is now array of objects: { name: "Rifle", rarity: "Epic", ... } or null
        // Player starts with Pickaxe object
        const gameState = {
            health: 100,
            inventory: [{name: "Pickaxe", rarity: "Common"}, null, null, null, null],
            activeSlot: 0,
            ammo: { clip: 0, reserve: 0 },
            activeWeaponData: null, // Current WEAPONS[type] + rarity stats
            enemiesAlive: BOT_COUNT,
            isReloading: false,
            lastShotTime: 0,
            burstCount: 0
        };
        
        // UI elements for damage indicator
        let damageIndicatorElement;

        // --- Init ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);
            
            // Lights
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            
            // Initialize damage indicator
            damageIndicatorElement = document.getElementById('damage-indicator');
            const arrow = document.createElement('div');
            arrow.className = 'damage-arrow';
            damageIndicatorElement.appendChild(arrow);
            damageIndicatorElement.arrow = arrow;
            
            createTerrain();
            createPlayer();

            window.addEventListener('resize', onResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('mousemove', onMouseMove);
            
            // Auto Focus Fix
            window.addEventListener('focus', () => {
                if(isGameActive) document.body.requestPointerLock();
            });

            document.getElementById('play-btn').addEventListener('click', startGame);

            animate();
        }

        // --- Assets & Models ---
        function createHumanoidModel(color) {
            const group = new THREE.Group();
            const matBody = new THREE.MeshStandardMaterial({ color: color });
            const matSkin = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const matDark = new THREE.MeshStandardMaterial({ color: 0x333333 });

            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.3), matBody);
            torso.position.y = 0.35; 
            torso.castShadow = true;
            group.add(torso);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matSkin);
            head.position.y = 0.85;
            group.add(head);
            
            const eye = new THREE.Object3D();
            eye.position.set(0, 0, -0.2);
            head.add(eye);

            // Arms
            const armGeo = new THREE.BoxGeometry(0.18, 0.7, 0.18);
            const armL = new THREE.Mesh(armGeo, matBody);
            armL.position.set(-0.42, 0.5, 0);
            group.add(armL);

            const armR = new THREE.Mesh(armGeo, matBody);
            armR.position.set(0.42, 0.5, 0);
            // Pivot fix
            armR.geometry.translate(0, -0.25, 0);
            armR.rotation.y = Math.PI; 
            
            armR.position.y = 0.65;
            group.add(armR);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.22, 0.8, 0.22);
            const legL = new THREE.Mesh(legGeo, matDark);
            legL.position.set(-0.18, -0.4, 0);
            group.add(legL);
            const legR = new THREE.Mesh(legGeo, matDark);
            legR.position.set(0.18, -0.4, 0);
            group.add(legR);

            // Gun Model 
            const gunGroup = new THREE.Group();
            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.7), matDark);
            const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8), new THREE.MeshStandardMaterial({color: 0x111111}));
            gunBarrel.rotation.x = Math.PI / 2;
            gunBarrel.position.z = -0.4;
            gunGroup.add(gunBody);
            gunGroup.add(gunBarrel);
            
            gunGroup.rotation.y = Math.PI;
            gunGroup.position.set(0, -0.5, 0.2); 
            gunGroup.visible = false; 
            armR.add(gunGroup);

            // Pickaxe
            const pickGroup = new THREE.Group();
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8), new THREE.MeshStandardMaterial({color: 0x8B4513}));
            const headPick = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), new THREE.MeshStandardMaterial({color: 0x777777}));
            handle.position.y = 0.2;
            headPick.position.y = 0.6;
            pickGroup.add(handle);
            pickGroup.add(headPick);
            
            pickGroup.rotation.y = Math.PI;
            pickGroup.rotation.x = Math.PI / 2;
            
            // FIX: Rotate Pickaxe 90 degrees left (Z axis in local space)
            pickGroup.rotation.z = Math.PI / 2;

            pickGroup.position.set(0, -0.5, 0.2);
            pickGroup.visible = false;
            armR.add(pickGroup);
            
            group.userData = { armL, armR, legL, legR, gun: gunGroup, gunBody, pickaxe: pickGroup, head, eye };
            return group;
        }

        function createTerrain() {
            const geo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, 64, 64);
            geo.rotateX(-Math.PI / 2);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                const y = (Math.sin(x*0.04) + Math.cos(z*0.04)) * 3 + (Math.sin(x*0.1) * Math.cos(z*0.1)) * 2;
                pos.setY(i, y);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: 0x558833, flatShading: true });
            terrainMesh = new THREE.Mesh(geo, mat);
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);
            // Trees
            for (let i = 0; i < 100; i++) {
                const x = (Math.random() - 0.5) * (WORLD_SIZE - 20);
                const z = (Math.random() - 0.5) * (WORLD_SIZE - 20);
                const y = getTerrainHeight(x, z);
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2, 6), new THREE.MeshStandardMaterial({color: 0x654321}));
                trunk.position.y = 1;
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 5, 8), new THREE.MeshStandardMaterial({color: 0x228B22}));
                leaves.position.y = 3.5;
                tree.add(trunk);
                tree.add(leaves);
                tree.position.set(x, y, z);
                tree.traverse(o => { if(o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
                scene.add(tree);
            }
        }

        function getTerrainHeight(x, z) {
            return (Math.sin(x*0.04) + Math.cos(z*0.04)) * 3 + (Math.sin(x*0.1) * Math.cos(z*0.1)) * 2;
        }

        function createPlayer() {
            const mesh = createHumanoidModel(0x3498db);
            player = {
                mesh: mesh,
                position: new THREE.Vector3(0, 50, 0),
                velocity: new THREE.Vector3(),
                onGround: false,
                isHit: false
            };
            scene.add(mesh);
        }

        function spawnBots() {
            const limit = WORLD_SIZE/2 - 50;
            for (let i=0; i<BOT_COUNT; i++) {
                let x, z, distance;
                do {
                    x = (Math.random() - 0.5) * limit * 2;
                    z = (Math.random() - 0.5) * limit * 2;
                    distance = Math.sqrt(x*x + z*z);
                } while (distance < BOT_SPAWN_RADIUS);
                
                const bot = {
                    mesh: createHumanoidModel(0xe74c3c),
                    position: new THREE.Vector3(x, 100, z),
                    velocity: new THREE.Vector3(),
                    health: 100,
                    lastShot: 0,
                    speed: 4 + Math.random() * 3,
                    aggro: false, 
                    flashTime: 0,
                    // Bots start with Pickaxe only
                    inventory: { name: "Pickaxe" }, 
                    targetChest: null,
                    hasGun: false
                };
                
                // Initially ensure only pickaxe is visible
                bot.mesh.userData.gun.visible = false;
                bot.mesh.userData.pickaxe.visible = true;

                scene.add(bot.mesh);
                bots.push(bot);
            }
        }

        function spawnChests() {
            for (let i=0; i<CHEST_COUNT; i++) {
                const x = (Math.random()-0.5) * (WORLD_SIZE-50);
                const z = (Math.random()-0.5) * (WORLD_SIZE-50);
                const y = getTerrainHeight(x, z) + 0.5;
                const chest = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), new THREE.MeshStandardMaterial({color: 0xf1c40f, roughness: 0.3}));
                chest.position.set(x, y, z);
                chest.castShadow = true;
                scene.add(chest);
                chests.push({ mesh: chest, opened: false });
            }
        }

        // --- Mechanics ---

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud-top').style.display = 'flex';
            document.getElementById('inventory-bar').style.display = 'flex';
            document.getElementById('damage-indicator').style.display = 'block';
            document.getElementById('kill-feed').innerHTML = ''; 
            document.body.requestPointerLock();
            // Reset
            gameState.health = 100;
            gameState.inventory = [{name: "Pickaxe", rarity: "Common"}, null, null, null, null];
            gameState.activeSlot = 0;
            gameState.ammo = { clip: 0, reserve: 0 };
            gameState.enemiesAlive = BOT_COUNT;
            gameState.activeWeaponData = null;
            gameState.burstCount = 0;
            
            bots.forEach(b => scene.remove(b.mesh)); bots = [];
            chests.forEach(c => scene.remove(c.mesh)); chests = [];
            projectiles.forEach(p => scene.remove(p.mesh)); projectiles = [];
            
            spawnBots();
            spawnChests();
            updateInventoryUI();
            updateHUD();

            player.position.set(0, 60, 0);
            player.velocity.set(0,0,0);
            isGameActive = true;
        }

        function getRandomRarity() {
            const rand = Math.random();
            if(rand < 0.5) return "Common";
            if(rand < 0.8) return "Rare";
            if(rand < 0.95) return "Epic";
            return "Legendary";
        }

        function updateInventoryUI() {
            for (let i=0; i<5; i++) {
                const el = document.getElementById(`item-${i}`);
                const slot = document.getElementById(`slot-${i}`);
                const item = gameState.inventory[i];
                
                if(item) {
                    const rarity = RARITIES[item.rarity || "Common"];
                    el.innerHTML = `${item.name}<br><span class="rarity-text" style="color:#${rarity.color.toString(16)}">${rarity.name}</span>`;
                    slot.style.borderColor = `#${rarity.color.toString(16)}`;
                } else {
                    el.innerText = "Empty";
                    slot.style.borderColor = "#555";
                }
                
                slot.className = i === gameState.activeSlot ? "slot active" : "slot";
            }
            updatePlayerModelGear();
        }

        function updatePlayerModelGear() {
            const item = gameState.inventory[gameState.activeSlot];
            const parts = player.mesh.userData;
            
            if(!item) {
                 parts.pickaxe.visible = false;
                 parts.gun.visible = false;
                 gameState.activeWeaponData = null;
                 updateHUD();
                 return;
            }

            const weaponData = WEAPONS[item.name];
            const rarity = RARITIES[item.rarity || "Common"];

            parts.pickaxe.visible = (item.name === "Pickaxe");
            
            if (weaponData) {
                parts.gun.visible = true;
                parts.gunBody.material.color.setHex(rarity.color);
                
                // Update Active Weapon Stats if switched
                if (gameState.activeWeaponData?.inventoryId !== item) { // Simple identity check
                    // If it's a new weapon, set clip
                    // If just switching back, keep clip (simplified here: always reset clip on pickup, preserve on swap if implemented deeper)
                    if(!gameState.activeWeaponData || gameState.activeWeaponData.name !== item.name) {
                        gameState.ammo.clip = weaponData.clip;
                    }
                    
                    gameState.activeWeaponData = { 
                        ...weaponData, 
                        rarityMult: rarity.damageMult,
                        name: item.name,
                        inventoryId: item 
                    };
                    camOffsetAds = new THREE.Vector3(0.5, 0.0, weaponData.adsZoom);
                }
            } else {
                parts.gun.visible = false;
                gameState.activeWeaponData = null;
            }
            
            updateHUD();
        }

        function createProjectile(start, dir, isPlayer, damage) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 4, 4), 
                new THREE.MeshBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff4400 })
            );
            mesh.position.copy(start);
            scene.add(mesh);
            
            const tailGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,2)]);
            const tail = new THREE.Line(tailGeo, new THREE.LineBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff4400, transparent: true, opacity: 0.5 }));
            mesh.add(tail);
            tail.lookAt(dir);
            
            const p = {
                mesh: mesh,
                velocity: dir.clone().multiplyScalar(PROJECTILE_SPEED),
                life: 1.5,
                fromPlayer: isPlayer,
                lastPos: start.clone(),
                damage: damage
            };
            projectiles.push(p);
            return p;
        }

        function checkProjectileCollision(p, step) {
            const start = p.lastPos;
            const end = p.mesh.position;
            const direction = step.clone().normalize();
            const distance = step.length();
            
            const raycaster = new THREE.Raycaster(start, direction, 0, distance);
            
            if (!p.fromPlayer) {
                const playerHitbox = new THREE.Box3().setFromObject(player.mesh).expandByScalar(0.5);
                if (playerHitbox.containsPoint(end)) {
                    takeDamage(p.damage, p.shooterPos);
                    return true;
                }
            }

            if (p.fromPlayer) {
                for(let bot of bots) {
                    const botHitbox = new THREE.Box3().setFromObject(bot.mesh).expandByScalar(HITBOX_PADDING);
                    if (botHitbox.containsPoint(end)) {
                        applyBotDamage(bot, p.damage);
                        return true;
                    }
                }
            }
            
            const intersects = raycaster.intersectObject(terrainMesh);
            if (intersects.length > 0) return true;
            return false;
        }

        function updateProjectiles(dt) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life -= dt;
                p.lastPos.copy(p.mesh.position); 
                const step = p.velocity.clone().multiplyScalar(dt);
                p.mesh.position.add(step);

                if (checkProjectileCollision(p, step) || p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function addKillFeed(msg) {
            const container = document.getElementById('kill-feed');
            const div = document.createElement('div');
            div.className = 'kill-msg';
            div.innerText = msg;
            container.appendChild(div);
            setTimeout(() => { if(div.parentNode) div.parentNode.removeChild(div); }, 4000);
        }

        function applyBotDamage(bot, dmg) {
            bot.aggro = true;
            bot.health -= dmg;
            showDamage(bot.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)), Math.floor(dmg));
            bot.flashTime = 0.05;

            if (bot.health <= 0 && bots.includes(bot)) {
                scene.remove(bot.mesh);
                bots = bots.filter(b => b !== bot);
                gameState.enemiesAlive--;
                updateHUD();
                addKillFeed("You eliminated Enemy");
                if (gameState.enemiesAlive === 0) showWin();
            }
        }

        function shootPlayer() {
            if (gameState.isReloading || !gameState.activeWeaponData) return;
            const weapon = gameState.activeWeaponData;
            const now = performance.now();
            if (now - gameState.lastShotTime < weapon.fireRate) return;
            if (gameState.ammo.clip <= 0) { reload(); return; }

            gameState.lastShotTime = now;
            
            if (weapon.name === "Rifle") {
                // Burst Logic
                fireShot(weapon);
                setTimeout(() => fireShot(weapon), 100);
                setTimeout(() => fireShot(weapon), 200);
            } else {
                fireShot(weapon);
            }
        }

        function fireShot(weapon) {
            if (gameState.ammo.clip <= 0) return;
            gameState.ammo.clip--;
            updateHUD();

            const gunWorldPos = new THREE.Vector3();
            player.mesh.userData.gun.children[1].getWorldPosition(gunWorldPos);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); 
            
            const targetPoint = raycaster.ray.at(weapon.range, new THREE.Vector3());
            const pellets = weapon.pellets || 1;
            
            const damage = weapon.damage * weapon.rarityMult;

            for(let i=0; i<pellets; i++) {
                const dir = new THREE.Vector3().subVectors(targetPoint, gunWorldPos).normalize();
                const currentSpread = isADS ? weapon.spread * 0.3 : weapon.spread;
                dir.x += (Math.random()-0.5) * currentSpread;
                dir.y += (Math.random()-0.5) * currentSpread;
                dir.z += (Math.random()-0.5) * currentSpread;
                dir.normalize();

                createProjectile(gunWorldPos, dir, true, damage);
            }
        }

        function shootBot(bot) {
            // Bots use default damage values scaled by their weapon rarity
            // If bot has no weapon struct, use default
            let weapon = { damage: 10, fireRate: 800, range: 100 }; 
            let rarityMult = 1.0;

            if (bot.hasGun) {
                // Assume bots get a standard rifle-like weapon when they find a chest
                weapon = { ...WEAPONS["Rifle"], fireRate: 800 }; 
                rarityMult = RARITIES[bot.inventory.rarity].damageMult;
            }

            if (performance.now() - bot.lastShot < weapon.fireRate) return;
            bot.lastShot = performance.now();
            
            const gunPos = bot.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0.5));
            const target = player.position.clone().add(new THREE.Vector3(0,1.5,0));
            let dir = new THREE.Vector3().subVectors(target, gunPos).normalize();
            
            const dist = bot.position.distanceTo(player.position);
            const accuracyFactor = dist / 60; 
            let spread = 0.02 * accuracyFactor;
            if (Math.random() < BOT_MISS_CHANCE) spread += 0.1; 
            
            dir.x += (Math.random()-0.5) * spread;
            dir.y += (Math.random()-0.5) * spread;
            dir.z += (Math.random()-0.5) * spread;
            dir.normalize();

            const damage = weapon.damage * rarityMult;
            const p = createProjectile(gunPos, dir, false, damage);
            p.shooterPos = bot.position.clone(); 
        }

        function reload() {
            if (gameState.isReloading || gameState.ammo.clip === gameState.activeWeaponData?.clip || gameState.ammo.reserve === 0) return;
            gameState.isReloading = true;
            document.getElementById('reload-msg').style.display = 'block';
            setTimeout(() => {
                if(gameState.activeWeaponData) {
                    const maxClip = gameState.activeWeaponData.clip;
                    const needed = maxClip - gameState.ammo.clip;
                    const taken = Math.min(needed, gameState.ammo.reserve);
                    gameState.ammo.clip += taken;
                    gameState.ammo.reserve -= taken;
                }
                gameState.isReloading = false;
                document.getElementById('reload-msg').style.display = 'none';
                updateHUD();
            }, 1500);
        }

        // --- Update Loop ---

        function updatePlayerLogic(dt) {
            if (!isGameActive) return;
            // Shooting Logic for Full Auto
            if (keys.mouse && gameState.activeWeaponData && gameState.activeWeaponData.auto) {
                shootPlayer();
            }

            player.mesh.rotation.y = cameraRotation.y;
            const dir = new THREE.Vector3();
            const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), cameraRotation.y);
            const right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), cameraRotation.y);

            if (keys.w) dir.add(fwd);
            if (keys.s) dir.sub(fwd);
            if (keys.d) dir.add(right);
            if (keys.a) dir.sub(right);
            if (dir.lengthSq() > 0) dir.normalize();

            player.position.add(dir.multiplyScalar(PLAYER_SPEED * dt));
            player.velocity.y -= GRAVITY * dt;
            player.position.y += player.velocity.y * dt;

            const groundY = getTerrainHeight(player.position.x, player.position.z);
            if (player.position.y < groundY + 1.1) {
                player.position.y = groundY + 1.1;
                player.velocity.y = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }

            if (keys.space && player.onGround) {
                player.velocity.y = JUMP_FORCE;
            }

            const lim = WORLD_SIZE/2 - 2;
            player.position.x = THREE.MathUtils.clamp(player.position.x, -lim, lim);
            player.position.z = THREE.MathUtils.clamp(player.position.z, -lim, lim);

            player.mesh.position.copy(player.position);
            
            const headPos = player.position.clone().add(new THREE.Vector3(0, 1.6, 0));
            const targetOffset = isADS ? camOffsetAds : CAM_OFFSET_NORMAL;
            const euler = new THREE.Euler(0, cameraRotation.y, 0, 'YXZ');
            const rotOffset = targetOffset.clone().applyEuler(euler);
            const camTarget = headPos.clone().add(rotOffset);
            camTarget.y += Math.sin(cameraRotation.x) * 2; 

            camera.position.lerp(camTarget, 0.2);
            const lookDir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(cameraRotation.x, cameraRotation.y, 0, 'YXZ'));
            camera.lookAt(headPos.clone().add(lookDir.multiplyScalar(10)));
            
            const isWalking = dir.lengthSq() > 0;
            animateModel(player.mesh, dt, isWalking, isADS, gameState.isReloading);
        }

        function checkBotVisibility(bot) {
            const dist = bot.position.distanceTo(player.position);
            if (dist > 100) return false; 
            const botEyePos = bot.position.clone().add(new THREE.Vector3(0, 1.6, 0));
            const dirToPlayer = new THREE.Vector3().subVectors(player.position, bot.position).normalize();
            const ray = new THREE.Raycaster(botEyePos, dirToPlayer);
            const intersects = ray.intersectObject(terrainMesh);
            const distToTerrain = (intersects.length > 0) ? intersects[0].distance : 9999;
            if (dist < distToTerrain) return true;
            return false;
        }

        function updateBotsLogic(dt) {
            for(const bot of bots) {
                // Handle Flash
                if (bot.flashTime > 0) {
                    bot.flashTime -= dt;
                    bot.mesh.traverse(c => { if(c.isMesh && c.material.emissive) c.material.emissive.setHex(0xffffff); });
                } else {
                    bot.mesh.traverse(c => { if(c.isMesh && c.material.emissive) c.material.emissive.setHex(0x000000); });
                }

                // --- BOT AI ---
                let moving = false;
                let pitch = 0;

                if (!bot.hasGun) {
                    // STATE 1: SEARCH FOR WEAPON
                    if (!bot.targetChest || bot.targetChest.opened) {
                        // Find nearest unopened chest
                        let minDist = 9999;
                        let nearest = null;
                        for(const c of chests) {
                            if(!c.opened) {
                                const d = bot.position.distanceTo(c.mesh.position);
                                if(d < minDist) { minDist = d; nearest = c; }
                            }
                        }
                        bot.targetChest = nearest;
                    }

                    if (bot.targetChest) {
                        const dist = bot.position.distanceTo(bot.targetChest.mesh.position);
                        if (dist > 3) {
                            const dir = new THREE.Vector3().subVectors(bot.targetChest.mesh.position, bot.position).normalize();
                            dir.y = 0;
                            bot.position.add(dir.multiplyScalar(bot.speed * dt));
                            bot.mesh.lookAt(bot.targetChest.mesh.position.x, bot.position.y, bot.targetChest.mesh.position.z);
                            moving = true;
                        } else {
                            // Open Chest
                            bot.targetChest.opened = true;
                            bot.targetChest.mesh.material.color.setHex(0x555555);
                            
                            // Equip Gun
                            bot.hasGun = true;
                            const types = ["Rifle", "Shotgun", "SMG"]; // Bots prefer standard guns
                            const type = types[Math.floor(Math.random()*types.length)];
                            const rarityName = getRandomRarity();
                            
                            bot.inventory = { name: type, rarity: rarityName };
                            
                            // Visuals
                            bot.mesh.userData.pickaxe.visible = false;
                            bot.mesh.userData.gun.visible = true;
                            bot.mesh.userData.gunBody.material.color.setHex(RARITIES[rarityName].color);
                        }
                    }

                } else {
                    // STATE 2: COMBAT
                    const dist = bot.position.distanceTo(player.position);
                    const canSee = checkBotVisibility(bot);
                    let shouldChase = bot.aggro || (canSee && dist < 80);

                    if (shouldChase && dist > 15) {
                        const dir = new THREE.Vector3().subVectors(player.position, bot.position).normalize();
                        dir.y = 0;
                        bot.position.add(dir.multiplyScalar(bot.speed * dt));
                        moving = true;
                    }
                    
                    if (shouldChase || canSee) {
                        bot.mesh.lookAt(player.position.x, bot.position.y, player.position.z);
                        const diff = new THREE.Vector3().subVectors(player.position, bot.position);
                        const distXZ = Math.sqrt(diff.x*diff.x + diff.z*diff.z);
                        pitch = -Math.atan2(diff.y, distXZ); 
                    }

                    if (canSee && dist < 60) shootBot(bot);
                }

                const gy = getTerrainHeight(bot.position.x, bot.position.z);
                bot.position.y = gy + 1.1;
                bot.mesh.position.copy(bot.position);

                animateModel(bot.mesh, dt, moving, false, false, pitch);
            }
        }

        function animateModel(mesh, dt, isMoving, ads, reloading, targetPitch = 0) {
            const p = mesh.userData;
            mesh.userData.time = (mesh.userData.time || 0) + dt * 10;
            const t = mesh.userData.time;
            
            if (isMoving) {
                p.legL.rotation.x = Math.sin(t)*0.6;
                p.legR.rotation.x = Math.sin(t+Math.PI)*0.6;
                p.armL.rotation.x = Math.sin(t+Math.PI)*0.6;
                if(!p.gun.visible && !p.pickaxe.visible) p.armR.rotation.x = Math.sin(t)*0.6;
            } else {
                p.legL.rotation.x = 0; p.legR.rotation.x = 0;
                p.armL.rotation.x = ARM_ROT_IDLE; 
                if(!p.gun.visible && !p.pickaxe.visible) p.armR.rotation.x = ARM_ROT_IDLE;
            }

            // Gun Arm Overrides
            // We negate ARM_ROT_HOLDING because user asked for PI/2, but forward in this rig is negative
            const forwardRot = -ARM_ROT_HOLDING; 

            if (p.gun.visible) {
                if (reloading) {
                    p.armR.rotation.x = forwardRot + 0.5; 
                } else if (ads) {
                    p.armR.rotation.x = forwardRot - 0.2;
                    p.armR.rotation.y = Math.PI - 0.2; 
                } else {
                    if(targetPitch !== 0) {
                        p.armR.rotation.x = forwardRot + targetPitch;
                    } else {
                        p.armR.rotation.x = forwardRot + (isMoving ? Math.sin(t)*0.1 : 0);
                    }
                    p.armR.rotation.y = Math.PI; 
                }
            }
            
            // Pickaxe Arm Overrides
            if (p.pickaxe.visible) {
                 if(keys.mouse && !isMoving && mesh === player.mesh) { // Only player swings on click
                     p.armR.rotation.x = forwardRot + Math.sin(t*4) * 0.8;
                 } else {
                     p.armR.rotation.x = forwardRot;
                 }
                 p.armR.rotation.y = Math.PI;
            }
        }

        function checkInteractions() {
            let nearChest = false;
            for(const c of chests) {
                if(!c.opened && c.mesh.position.distanceTo(player.position) < 4) {
                    nearChest = true;
                    if(keys.e) {
                        c.opened = true;
                        c.mesh.material.color.setHex(0x555555);
                        
                        const types = Object.keys(WEAPONS);
                        const rando = types[Math.floor(Math.random() * types.length)];
                        const rarityName = getRandomRarity();
                        const rarity = RARITIES[rarityName];
                        
                        const newItem = { name: rando, rarity: rarityName };

                        const emptyIdx = gameState.inventory.indexOf(null);
                        if(emptyIdx !== -1) {
                            gameState.inventory[emptyIdx] = newItem;
                            showWeaponMsg(`Picked up ${rarityName} ${rando}!`, rarity.color);
                        } else {
                            if (gameState.activeSlot !== 0) {
                                gameState.inventory[gameState.activeSlot] = newItem;
                                showWeaponMsg(`Swapped for ${rarityName} ${rando}!`, rarity.color);
                            } else {
                                showWeaponMsg("Inventory Full!", 0xff0000);
                            }
                        }
                        
                        gameState.ammo.reserve += 40;
                        updateInventoryUI();
                        keys.e = false;
                    }
                }
            }
            document.getElementById('interaction-msg').style.display = nearChest ? 'block' : 'none';
        }

        function showDamage(pos, val) {
            const div = document.createElement('div');
            div.className = 'damage-popup';
            div.innerText = Math.floor(val);
            document.getElementById('ui-layer').appendChild(div);
            damagePopups.push({ el: div, pos: pos.clone(), life: 1.0 });
        }

        function showWeaponMsg(text, colorHex) {
            const el = document.getElementById('weapon-msg');
            el.innerText = text;
            el.style.color = colorHex ? `#${colorHex.toString(16)}` : '#3498db';
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function updateUI(dt) {
            for(let i=damagePopups.length-1; i>=0; i--) {
                const p = damagePopups[i];
                p.life -= dt;
                p.pos.y += dt; 
                
                const screen = p.pos.clone().project(camera);
                const x = (screen.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(screen.y * 0.5) + 0.5) * window.innerHeight;
                
                p.el.style.left = x + 'px';
                p.el.style.top = y + 'px';
                p.el.style.opacity = p.life;

                if(p.life <= 0) {
                    p.el.remove();
                    damagePopups.splice(i, 1);
                }
            }
        }

        function updateHUD() {
            document.getElementById('health-display').innerText = Math.ceil(gameState.health);
            const item = gameState.inventory[gameState.activeSlot];
            
            if(item && WEAPONS[item.name]) {
                document.getElementById('ammo-display').innerText = `${gameState.ammo.clip} / ${gameState.ammo.reserve}`;
            } else {
                document.getElementById('ammo-display').innerText = "--";
            }
            
            document.getElementById('enemies-display').innerText = gameState.enemiesAlive;
            const ch = document.getElementById('crosshair');
            if (isADS) ch.className = 'ads';
            else if (gameState.activeWeaponData?.name === "Shotgun") ch.className = 'spread';
            else ch.className = '';
        }
        
        function showWin() { isGameActive = false;
            document.exitPointerLock(); document.getElementById('win-screen').style.display = 'flex'; }
        
        function takeDamage(n, sourcePos) {
             gameState.health -= n;
             updateHUD();
             
             if (sourcePos) {
                const playerFwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.y);
                const dirToSource = new THREE.Vector3().subVectors(sourcePos, player.position).normalize();
                
                const angle = Math.atan2(playerFwd.z, playerFwd.x) - Math.atan2(dirToSource.z, dirToSource.x);
                let degrees = angle * (180 / Math.PI);
                degrees = (degrees + 360) % 360;

                damageIndicatorElement.style.display = 'block';
                damageIndicatorElement.arrow.style.opacity = 1.0;
                damageIndicatorElement.arrow.style.transform = `rotate(${-degrees}deg) translateX(200px)`;

                clearTimeout(damageIndicatorElement.timer);
                damageIndicatorElement.timer = setTimeout(() => {
                    damageIndicatorElement.arrow.style.opacity = 0;
                }, 500);
             }


             if(gameState.health <= 0) { 
                isGameActive = false;
                addKillFeed("Enemy eliminated Player");
                document.exitPointerLock(); 
                document.getElementById('death-screen').style.display = 'flex'; 
            }
        }

        // --- Input ---
        function onKeyDown(e) {
            const k = e.key.toLowerCase();
            if(keys[k] !== undefined) keys[k] = true;
            if(k === 'e') keys.e = true;
            if(['1','2','3','4','5'].includes(k)) {
                gameState.activeSlot = parseInt(k) - 1;
                updateInventoryUI();
            }
        }
        function onKeyUp(e) {
            const k = e.key.toLowerCase();
            if(keys[k] !== undefined) keys[k] = false;
            if(k === 'e') keys.e = false;
        }
        function onMouseDown(e) {
            if(!isGameActive) return;
            if(e.button === 0) {
                keys.mouse = true;
                // Handle semi-auto or burst here (Rifle/Shotgun/Sniper)
                // Full auto handled in updatePlayerLogic
                if(gameState.inventory[gameState.activeSlot]?.name === "Pickaxe") {
                    // Pickaxe swing handled in animation
                } else if (gameState.activeWeaponData && !gameState.activeWeaponData.auto) {
                    shootPlayer();
                }
            }
            if(e.button === 2) {
                if(gameState.inventory[gameState.activeSlot] && WEAPONS[gameState.inventory[gameState.activeSlot].name]) {
                    isADS = true;
                }
            }
        }
        function onMouseUp(e) {
            if(e.button === 0) keys.mouse = false;
            if(e.button === 2) isADS = false;
        }
        function onMouseMove(e) {
            if(document.pointerLockElement === document.body && isGameActive) {
                const sens = isADS ? 0.001 : 0.002;
                cameraRotation.y -= e.movementX * sens;
                cameraRotation.x -= e.movementY * sens;
                cameraRotation.x = Math.max(-1.4, Math.min(1.4, cameraRotation.x));
            }
        }
        function onResize() {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const dt = Math.min((time - lastTime)/1000, 0.1);
            lastTime = time;
            if (isGameActive) {
                updatePlayerLogic(dt);
                updateBotsLogic(dt);
                updateProjectiles(dt);
                checkInteractions();
                updateUI(dt);
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
        }
    </script>
</body>
</html>
