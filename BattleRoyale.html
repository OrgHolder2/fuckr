                div.className = isCrit ? 'damage-popup crit' : 'damage-popup';
                div.innerText = Math.floor(val);
                document.getElementById('ui-layer').appendChild(div);

                const popupObj = { el: div, pos: entity.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)), life: 1.0, isCrit: isCrit };
                damagePopups.push(popupObj);

                uData.lastDamagePopup = {
                    element: div,
                    value: Math.floor(val),
                    timestamp: now
                };
            }
        }

        function updateUI(dt) {
            for(let i=damagePopups.length-1; i>=0; i--) {
                const p = damagePopups[i];
                p.life -= dt;
                p.pos.y += dt * 0.5; // Slowly float up

                const screen = p.pos.clone().project(camera);
                const x = (screen.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(screen.y * 0.5) + 0.5) * window.innerHeight;

                p.el.style.left = x + 'px';
                p.el.style.top = y + 'px';
                p.el.style.opacity = p.life;

                if(p.life <= 0) {
                    p.el.remove();
                    damagePopups.splice(i, 1);
                }
            }
        }

        function showWin() { isGameActive = false;
            document.exitPointerLock(); document.getElementById('win-screen').style.display = 'flex'; }

        function takeDamage(n, sourcePos) {
             gameState.health -= n;
             updateHUD();

             if (sourcePos) {
                const playerDir = new THREE.Vector3();
                camera.getWorldDirection(playerDir);
                playerDir.y = 0;
                playerDir.normalize();
                const toSource = new THREE.Vector3().subVectors(sourcePos, player.position);
                toSource.y = 0;
                toSource.normalize();
                const cross = new THREE.Vector3().crossVectors(playerDir, toSource);
                const dot = playerDir.dot(toSource);
                let angle = Math.atan2(cross.y, dot);
                let deg = angle * (180 / Math.PI);
                deg = -deg;

                // Create New Indicator Arrow
                const container = document.getElementById('damage-indicator-container');
                const arrow = document.createElement('div');
                arrow.className = 'damage-arrow';
                arrow.style.transform = `translate(-50%, -150px) rotate(${deg}deg)`;
                container.appendChild(arrow);

                // Fade Out Logic
                // Trigger reflow
                void arrow.offsetWidth;
                arrow.style.opacity = 0; // Start fade

                setTimeout(() => {
                    if(arrow.parentNode) arrow.parentNode.removeChild(arrow);
                }, 2000);
             }

             if(gameState.health <= 0) {
                isGameActive = false;
                addKillFeed(`${player.name} sucks ass`);
                document.exitPointerLock();
                document.getElementById('death-screen').style.display = 'flex';
            }
        }

        function onKeyDown(e) {
            const k = e.key.toLowerCase();
            if(keys[k] !== undefined) keys[k] = true;
            if(e.key === " ") keys.space = true; // FIXED: explicit space check
            if(e.key === "Shift") keys.shift = true;
            if(k === 'e') interactionState.holding = true; // Use interactionState
            if(k === 'g' && isGameActive) dropWeapon();
            if(k === 'r' && isGameActive) reload();
            if(['1','2','3','4','5'].includes(k)) {
                const idx = parseInt(k) - 1;
                if (gameState.inventory[idx]) {
                    gameState.activeSlot = idx;
                    updateInventoryUI();
                }
            }
        }
        function onKeyUp(e) {
            const k = e.key.toLowerCase();
            if(keys[k] !== undefined) keys[k] = false;
            if(e.key === " ") keys.space = false; // FIXED
            if(e.key === "Shift") keys.shift = false;
            if(k === 'e') { // Use interactionState
                interactionState.holding = false;
                interactionState.progress = 0;
                interactionState.target = null;
            }
        }
        function onMouseDown(e) {
            if(!isGameActive) return;
            if(e.button === 0) {
                keys.mouse = true;
                const curItem = gameState.inventory[gameState.activeSlot];
                if(curItem && curItem.name === "Pickaxe") {
                    // Auto swing handled in Update
                } else if (gameState.activeWeaponData && !gameState.activeWeaponData.auto) {
                    shootPlayer();
                }
            }
            if(e.button === 2) {
                if(gameState.inventory[gameState.activeSlot] && WEAPONS[gameState.inventory[gameState.activeSlot].name]) {
                    isADS = true;
                }
            }
        }
        function onMouseUp(e) {
            if(e.button === 0) keys.mouse = false;
            if(e.button === 2) isADS = false;
        }
        function onMouseMove(e) {
            if(document.pointerLockElement === document.body && isGameActive) {
                const sens = isADS ? 0.001 : 0.002;
                cameraRotation.y -= e.movementX * sens;
                // Reverted to inverted controls as requested
                cameraRotation.x -= e.movementY * sens;
                cameraRotation.x = Math.max(-1.4, Math.min(1.4, cameraRotation.x));
            }
        }
        function onResize() {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const dt = Math.min((time - lastTime)/1000, 0.1);
            lastTime = time;
            if (isGameActive) {
                updatePlayerLogic(dt);
                updateBotsLogic(dt);
                updateProjectiles(dt);
                checkInteractions(dt); // Pass dt
                updateUI(dt);
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
        }
    </script>
</body>
</html>
